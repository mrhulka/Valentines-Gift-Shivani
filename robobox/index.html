<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robobox Connect</title>
<meta name="theme-color" content="#F2BE14">
<meta name="description" content="Log a Connect. Every school interaction becomes structured sales intelligence.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23F2BE14'/><text x='16' y='23' font-size='18' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%2323262C'>R</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="login-brand"><span class="logo">R</span> Robobox <em>Connect</em></div>
    <p class="login-sub">Log what you just did. The system works out the rest.</p>
    <form id="login-form" autocomplete="off">
      <label class="field"><span class="field-label">Who are you?</span>
        <select id="login-user" class="input"></select></label>
      <label class="field"><span class="field-label">Access code</span>
        <input id="login-pin" class="input" type="password" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
    <p class="login-hint">Demo build — the access code is your first name in lowercase.</p>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <header class="topbar">
    <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="Menu">&#9776;</button>
    <div class="brand"><span class="logo">R</span> <span class="brand-word">Robobox <small>Connect</small></span></div>
    <div class="topbar-search" style="position:relative;flex:1;max-width:400px">
      <input id="global-search" class="input" type="search" placeholder="Search schools…" autocomplete="off">
      <div id="search-results" hidden style="position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-2);z-index:60;max-height:380px;overflow:auto"></div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="theme-toggle" title="Switch theme" aria-label="Switch theme">&#9681;</button>
      <span class="avatar" id="user-avatar"></span>
      <span class="user-meta"><strong id="user-name"></strong><em id="user-role"></em></span>
      <button class="btn btn-ghost btn-sm" id="logout">Sign out</button>
    </div>
  </header>
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main" tabindex="-1"></main>
  <button class="fab" id="fab">+ Log Connect</button>
</div>

<div id="modal-root" class="modal-root" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <header class="modal-head"><h2 id="modal-title"></h2>
      <button class="icon-btn" data-close="1" aria-label="Close">&times;</button></header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="tooltip" class="viz-tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="assets/js/seed-data.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/model.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/connect-form.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
